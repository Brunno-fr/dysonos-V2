spring:
  application:
    name: dysonos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dysonos}
    username: ${DB_USERNAME:dysonos}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: ${SERVER_PORT:8080}
