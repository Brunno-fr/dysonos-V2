spring:
  application:
    name: dysonos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dysonos}
    username: ${DB_USERNAME:dysonos}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
server:
  port: ${SERVER_PORT:8080}
dysonos:
  node:
    cpu-overload-threshold: ${NODE_CPU_OVERLOAD_THRESHOLD:80.0}
    memory-overload-threshold: ${NODE_MEMORY_OVERLOAD_THRESHOLD:80.0}
